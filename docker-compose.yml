version: '3.9'

services:
  web:
    build:
      context: .
    image: gutenberg-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
    volumes:
      - .:/code
    command: python manage.py runserver 0.0.0.0:8000